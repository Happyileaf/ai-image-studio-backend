# ====== 测试环境配置（Testcontainers 2.x 动态端口）======
# 集成测试通过 @TestConfiguration 动态注入容器暴露的端口

spring:
  datasource:
    url: jdbc:mysql://localhost:${TEST_MYSQL_PORT:3306}/style_transfer_test?useUnicode=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: test123
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: ${TEST_REDIS_PORT:6379}
      password:
  rabbitmq:
    host: localhost
    port: ${TEST_RABBITMQ_PORT:5672}
    username: guest
    password: guest

minio:
  endpoint: http://localhost:${TEST_MINIO_PORT:9000}
  access-key: minioadmin
  secret-key: minioadmin
  buckets:
    source-temp: test-source-temp
    result: test-result
    style: test-style-cover

jwt:
  secret: test-jwt-secret-for-test-environment-only-please-do-not-use-in-prod
  access-token-ttl: 30m
  refresh-token-ttl: 1d

app:
  quota:
    default: 100
  task:
    max-retry: 0
    ai-timeout: 5s
